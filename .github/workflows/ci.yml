name: Google Search Question and Answer Bot CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  python-tests:
    name: Python Scraper & LLM Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f python/requirements.txt ]; then pip install -r python/requirements.txt; fi

      - name: Run Python unit tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test-mock-key' }}
        run: |
          pytest python/ -v

  android-build:
    name: Android Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup environment secrets
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'dummy_ci_key' }}" > .env

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew || true

      - name: Run Android Unit Tests
        run: |
          ./gradlew testDebugUnitTest --no-daemon --stacktrace || gradle testDebugUnitTest --no-daemon
